name: Bug report
description: Something in bHold easyPlace looks wrong or broken.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: bHold easyPlace version
      placeholder: 0.5.0+26.2
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Minecraft, Litematica, and malilib versions
      placeholder: 26.2, Litematica 0.28.4, malilib 0.29.3
    validations:
      required: true
  - type: dropdown
    id: server
    attributes:
      label: Where it happened
      options:
        - Singleplayer
        - Multiplayer, vanilla items
        - Multiplayer, server custom items (infinite blocks and similar)
    validations:
      required: true
  - type: dropdown
    id: easyplacefix
    attributes:
      label: EasyPlaceFix installed
      description: EasyPlaceFix takes over placement on multiplayer, so this changes which mod is doing the work.
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the relevant part of latest.log, or attach the whole file. Lines from bholdeasyplace and any stack trace are the useful part.
      render: text
    validations:
      required: false
